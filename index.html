function drawM(){const o=opts(cur);
  $('#mi').innerHTML=`<div class="big">${cur.e}${img(cur)}</div><div class="pad"><small style="color:#8a6a55;font-weight:700">${cur.c.t}${cur.g?' › '+cur.g:''}</small><h3>${cur.n}</h3>${o.length>1?`<div class="sz">${o.map((x,j)=>`<button class="${j==si?'on':''}" onclick="si=${j};drawM()">${x[0]}<small>${x[1]} ج</small></button>`).join('')}</div>`:`<div style="font-weight:800;color:var(--r);font-size:20px">${o[0][1]} ج</div>`}</div>`;tot()}
function tot(){$('#q').textContent=qty;$('#add').textContent=`أضف للسلة · ${opts(cur)[si][1]*qty} ج`}
function addCart(){const o=opts(cur)[si],t=$('#mn').value.trim(),k=cur.i+'|'+si+'|'+t,f=cart.find(x=>x.k==k);

function bar(){$('#bar').classList.toggle('on',cart.length>0);$('#bc').textContent=`🛒 السلة (${cnt()})`;$('#bt').textContent=sum()+' ج'}
function openCart(){drawC();show('#cartm')}
function drawC(){$('#cl').innerHTML=cart.length?cart.map((x,i)=>`<div class="line"><div>${x.n}${x.s?' ('+x.s+')':''}<small>${x.p*x.q} ج${x.t?' · '+x.t:''}</small></div><div class="qty"><button onclick="chg(${i},1)">+</button><i>${x.q}</i><button onclick="chg(${i},-1)">−</button></div></div>`).join(''):'<p style="padding:14px 0">السلة فاضية</p>';$('#ct').textContent=sum()+' ج'}
function chg(i,d){cart[i].q+=d;if(cart[i].q<1)cart.splice(i,1);save();bar();cart.length?drawC():closeAll()}
function send(){const n=$('#cn').value.trim(),p=$('#cp').value.trim(),a=$('#ca').value.trim(),x=$('#cx').value.trim();
  if(!cart.length)return;if(!n||!p||!a){alert('من فضلك اكتب الاسم ورقم الموبايل والعنوان');return}
  const m=`🍕 *طلب جديد - الوزير*\n──────────\n`+cart.map(i=>`• ${i.q}× ${i.n}${i.s?' ('+i.s+')':''} — ${i.p*i.q} ج${i.t?'\n   ملاحظة: '+i.t:''}`).join('\n')+`\n──────────\n💰 *الإجمالي: ${sum()} ج*\n👤 الاسم: ${n}\n📞 الموبايل: ${p}\n📍 العنوان: ${a}`+(x?`\n📝 ${x}`:'');
  window.open(`https://wa.me/${WA}?text=${encodeURIComponent(m)}`,'_blank');
  cart=[];save();bar();closeAll()}
